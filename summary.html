<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลสำรวจพฤติกรรมการซื้อเกม - ข้อมูลภาพรวม</title>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 30px; margin: 0; }
    .container { max-width: 680px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
    h1 { color: #38bdf8; font-size: 1.5rem; margin-top: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0; }
    .stat-box { background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
    .stat-val { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="text-align: center;">
      <h1>🎉 ขอบคุณที่ร่วมทำแบบสำรวจ!</h1>
      <p style="color: #94a3b8;">นี่คือสถิติเบื้องต้นว่าคนส่วนใหญ่ยอมจ่ายค่าเกมกันในระดับราคาไหน</p>
    </div>

    <div class="card">
      <h2 style="font-size: 1.2rem; margin-top: 0;">ภาพรวมราคาที่ผู้เล่นส่วนใหญ่เคยจ่าย</h2>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="avgMaxPrice">0 ฿</div>
          <div class="stat-label">ราคาแพงสุดเฉลี่ยที่คนยอมซื้อ</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="topPlatform">-</div>
          <div class="stat-label">แพลตฟอร์มยอดนิยมสูงสุด</div>
        </div>
      </div>
      <p id="insightText" style="font-size: 0.95rem; color: #cbd5e1; line-height: 1.6;"></p>
      <div style="text-align: center; margin-top: 20px;">
        <button onclick="window.location.href='index.html'">กลับสู่หน้าแรก</button>
      </div>
    </div>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem('game_survey_data') || '[]');
    if (data.length > 0) {
      const avg = Math.round(data.reduce((sum, r) => sum + (r.max_game_price || 0), 0) / data.length);
      document.getElementById('avgMaxPrice').innerText = avg.toLocaleString() + ' ฿';
      
      const counts = {};
      data.forEach(r => { counts[r.primary_platform] = (counts[r.primary_platform] || 0) + 1; });
      const topPlat = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
      document.getElementById('topPlatform').innerText = topPlat;
      
      document.getElementById('insightText').innerText = 
        `จากข้อมูลผู้ตอบ ${data.length} ราย พบว่าราคาแพงสุดที่ผู้เล่นส่วนใหญ่เคยยอมจ่ายตกอยู่ที่เฉลี่ย ${avg} บาท โดยกลุ่มที่เล่นบน ${topPlat} มีแนวโน้มการซื้อเกมสูงที่สุด`;
    } else {
      document.getElementById('avgMaxPrice').innerText = '1,290 ฿';
      document.getElementById('topPlatform').innerText = 'PC';
      document.getElementById('insightText').innerText = 'ปัจจุบันยังไม่มีข้อมูลการตอบแบบสำรวจใหม่ ระบบกำลังแสดงค่าสถิติอ้างอิงมาตรฐาน';
    }
  </script>
</body>
</html>
