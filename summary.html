<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปผลการสำรวจ - CPE-443</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #152238;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .icon { font-size: 3rem; margin-bottom: 16px; }
        h1 { color: var(--success); font-size: 1.6rem; margin-bottom: 12px; }
        p { color: var(--text-sub); margin-bottom: 24px; font-size: 0.95rem; line-height: 1.5; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background-color: #0d1b2a;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
        }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-top: 4px; }
        .btn {
            display: inline-block;
            background-color: #334155;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">✅</div>
    <h1>บันทึกแบบสำรวจเรียบร้อยแล้ว</h1>
    <p>ขอขอบพระคุณสำหรับข้อมูลอันเป็นประโยชน์เพื่อการศึกษาวิชา CPE-443 ข้อมูลของท่านถูกนำไปร่วมประมวลผลในแบบจำลองเรียบร้อยแล้ว[cite: 8]</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div>จำนวนผู้ร่วมตอบขณะนี้</div>
            <div class="stat-value" id="respCount">...</div>
        </div>
        <div class="stat-card">
            <div>ราคาสูงสุดเฉลี่ยที่ยอมรับได้</div>
            <div class="stat-value" id="avgPrice">...</div>
        </div>
    </div>

    <a href="index.html" class="btn">กลับสู่หน้าแรก</a>
</div>

<script>
    fetch('get_analytics_data.php')
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('respCount').innerText = `${data.overview.total_respondents} คน`;
                document.getElementById('avgPrice').innerText = `${parseFloat(data.overview.avg_max_price).toLocaleString('th-TH', { maximumFractionDigits: 0 })} บาท`;
            }
        })
        .catch(() => {
            document.getElementById('respCount').innerText = '-';
            document.getElementById('avgPrice').innerText = '-';
        });
</script>

</body>
</html>
